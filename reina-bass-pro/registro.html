<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crear cuenta | Reina Bass Pro</title>
  <meta name="description" content="Crea tu cuenta en Reina Bass Pro y gestiona tus pedidos, direcciones y ofertas.">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- Bootstrap 5 (desde CDN) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

  <!-- Tipografía de la tienda -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&amp;display=swap" rel="stylesheet">

  <style>
    :root {
      --color-sand: #ded2aa;
      --color-navy: #0f172a;
      --color-green: #2e8736;
    }
    body {
      font-family: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--color-sand);
      color: var(--color-navy);
    }
    .auth-card {
      border: 2px solid var(--color-navy);
      box-shadow: 8px 8px 0 var(--color-navy);
      background: #fff;
    }
    .auth-brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 24px;
      font-weight: 800;
      color: var(--color-navy);
      text-decoration: none;
    }
    .auth-brand__mark {
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      border: 2px solid var(--color-navy);
      box-shadow: 2px 2px 0 var(--color-navy);
      background: var(--color-green);
      color: #fff;
    }
    .auth-brand__icon {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .btn-brand {
      background: var(--color-navy);
      border: 2px solid var(--color-navy);
      box-shadow: 3px 3px 0 var(--color-navy);
      color: #fff;
      font-weight: 800;
      letter-spacing: .02em;
      transition: transform .12s, box-shadow .12s;
    }
    .btn-brand:hover {
      background: var(--color-green);
      color: #fff;
      transform: translate(-2px, -2px);
      box-shadow: 5px 5px 0 var(--color-navy);
    }
    .form-control:focus {
      border-color: var(--color-green);
      box-shadow: 0 0 0 .25rem rgba(46, 135, 54, .25);
    }
    .auth-link { color: var(--color-green); font-weight: 700; }
  </style>
</head>
<body>

<!-- Sprite del icono de pez (el mismo que usa la tienda) -->
<svg class="d-none" width="0" height="0" aria-hidden="true" focusable="false">
  <symbol id="i-fish" viewBox="0 0 24 24"><path d="M2 12c3-5 8-7 13-5l3 2 4-3v12l-4-3-3 2c-5 2-10 0-13-5z"/><circle cx="15" cy="11" r="1"/></symbol>
</svg>

<main class="container py-5">
  <div class="row justify-content-center">
    <div class="col-12 col-sm-10 col-md-8 col-lg-6">

      <!-- Logo de la tienda (mismo SVG que index.html) -->
      <div class="text-center mb-4">
        <a class="auth-brand" href="index.html">
          <span class="auth-brand__mark"><svg class="auth-brand__icon" aria-hidden="true"><use href="#i-fish"/></svg></span>
          <span>REINA BASS PRO</span>
        </a>
      </div>

      <div class="auth-card p-4 p-md-5">
        <h1 class="h3 fw-bold mb-1">Crear cuenta</h1>
        <p class="text-secondary mb-4">Únete y gestiona tus pedidos y ofertas.</p>

        <form class="needs-validation" novalidate>
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label fw-semibold" for="nombre">Nombre</label>
              <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Tu nombre" autocomplete="given-name" minlength="2" required>
              <div class="invalid-feedback">Escribe tu nombre.</div>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold" for="apellidos">Apellidos</label>
              <input type="text" class="form-control" id="apellidos" name="apellidos" placeholder="Tus apellidos" autocomplete="family-name" minlength="2" required>
              <div class="invalid-feedback">Escribe tus apellidos.</div>
            </div>
          </div>

          <div class="mt-3">
            <label class="form-label fw-semibold" for="email">Correo electrónico</label>
            <input type="email" class="form-control" id="email" name="email" placeholder="tu@correo.com" autocomplete="email" required>
            <div class="invalid-feedback">Escribe un correo válido.</div>
          </div>

          <div class="row g-3 mt-0">
            <div class="col-md-6">
              <label class="form-label fw-semibold" for="password">Contraseña</label>
              <input type="password" class="form-control" id="password" name="password" placeholder="Mínimo 6 caracteres" autocomplete="new-password" minlength="6" required>
              <div class="invalid-feedback">Al menos 6 caracteres.</div>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold" for="password2">Repite la contraseña</label>
              <input type="password" class="form-control" id="password2" name="password2" placeholder="Repite la contraseña" autocomplete="new-password" required>
              <div class="invalid-feedback">Las contraseñas no coinciden.</div>
            </div>
          </div>

          <div class="form-check mt-4 mb-4">
            <input class="form-check-input" type="checkbox" id="terminos" name="terminos" required>
            <label class="form-check-label" for="terminos">
              Acepto la <a class="auth-link text-decoration-none" href="#">política de privacidad</a>
            </label>
            <div class="invalid-feedback">Debes aceptar la política de privacidad.</div>
          </div>

          <button type="submit" class="btn btn-brand w-100 py-2">CREAR CUENTA</button>
        </form>

        <hr class="my-4">
        <p class="text-center mb-0">
          ¿Ya tienes cuenta?
          <a class="auth-link text-decoration-none" href="login.html">Inicia sesión</a>
        </p>
      </div>

      <p class="text-center mt-4 mb-0">
        <a class="text-decoration-none text-secondary" href="index.html">&larr; Volver a la tienda</a>
      </p>

    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>

<script>
  (function () {
    "use strict";
    var forms = document.querySelectorAll(".needs-validation");
    Array.prototype.forEach.call(forms, function (form) {
      // Comprobación extra: que las dos contraseñas coincidan
      var pass = form.querySelector("#password");
      var pass2 = form.querySelector("#password2");
      function matchCheck() {
        if (!pass2) return;
        pass2.setCustomValidity(pass.value !== pass2.value ? "no-coincide" : "");
      }
      if (pass && pass2) {
        pass.addEventListener("input", matchCheck);
        pass2.addEventListener("input", matchCheck);
      }
      form.addEventListener("submit", function (e) {
        matchCheck();
        if (!form.checkValidity()) {
          e.preventDefault();
          e.stopPropagation();
        }
        form.classList.add("was-validated");
      }, false);
    });
  })();
</script>
</body>
</html>
