<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión | Reina Bass Pro</title>
  <meta name="description" content="Accede a tu cuenta de Reina Bass Pro para ver tus pedidos y tu lista de deseos.">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- Bootstrap 5 (desde CDN): empezamos a introducir el framework poco a poco -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

  <!-- Tipografía de la tienda -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&amp;display=swap" rel="stylesheet">

  <!-- Pequeños ajustes para mantener la identidad visual de Reina Bass Pro -->
  <style>
    :root {
      --color-sand: #ded2aa;
      --color-navy: #0f172a;
      --color-green: #2e8736;
    }
    body {
      font-family: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--color-sand);
      color: var(--color-navy);
    }
    .auth-card {
      border: 2px solid var(--color-navy);
      box-shadow: 8px 8px 0 var(--color-navy);
      background: #fff;
    }
    .auth-brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 24px;
      font-weight: 800;
      color: var(--color-navy);
      text-decoration: none;
    }
    .auth-brand__mark {
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      border: 2px solid var(--color-navy);
      box-shadow: 2px 2px 0 var(--color-navy);
      background: var(--color-green);
      color: #fff;
    }
    .auth-brand__icon {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    /* Reescribimos el color primario de Bootstrap con el verde de la tienda */
    .btn-brand {
      background: var(--color-navy);
      border: 2px solid var(--color-navy);
      box-shadow: 3px 3px 0 var(--color-navy);
      color: #fff;
      font-weight: 800;
      letter-spacing: .02em;
      transition: transform .12s, box-shadow .12s;
    }
    .btn-brand:hover {
      background: var(--color-green);
      color: #fff;
      transform: translate(-2px, -2px);
      box-shadow: 5px 5px 0 var(--color-navy);
    }
    .form-control:focus {
      border-color: var(--color-green);
      box-shadow: 0 0 0 .25rem rgba(46, 135, 54, .25);
    }
    .auth-link { color: var(--color-green); font-weight: 700; }
  </style>
</head>
<body>

<!-- Sprite del icono de pez (el mismo que usa la tienda) -->
<svg class="d-none" width="0" height="0" aria-hidden="true" focusable="false">
  <symbol id="i-fish" viewBox="0 0 24 24"><path d="M2 12c3-5 8-7 13-5l3 2 4-3v12l-4-3-3 2c-5 2-10 0-13-5z"/><circle cx="15" cy="11" r="1"/></symbol>
</svg>

<main class="container py-5">
  <div class="row justify-content-center">
    <div class="col-12 col-sm-10 col-md-7 col-lg-5">

      <!-- Logo de la tienda (mismo SVG que index.html) -->
      <div class="text-center mb-4">
        <a class="auth-brand" href="index.html">
          <span class="auth-brand__mark"><svg class="auth-brand__icon" aria-hidden="true"><use href="#i-fish"/></svg></span>
          <span>REINA BASS PRO</span>
        </a>
      </div>

      <div class="auth-card p-4 p-md-5">
        <h1 class="h3 fw-bold mb-1">Iniciar sesión</h1>
        <p class="text-secondary mb-4">Accede a tu cuenta para ver tus pedidos.</p>

        <!-- novalidate deja que Bootstrap muestre su propia validación -->
        <form class="needs-validation" novalidate>
          <div class="mb-3">
            <label class="form-label fw-semibold" for="email">Correo electrónico</label>
            <input type="email" class="form-control" id="email" name="email" placeholder="tu@correo.com" autocomplete="email" required>
            <div class="invalid-feedback">Escribe un correo válido.</div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold" for="password">Contraseña</label>
            <input type="password" class="form-control" id="password" name="password" placeholder="Tu contraseña" autocomplete="current-password" minlength="6" required>
            <div class="invalid-feedback">La contraseña debe tener al menos 6 caracteres.</div>
          </div>

          <div class="d-flex justify-content-between align-items-center mb-4">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="recordar" name="recordar">
              <label class="form-check-label" for="recordar">Recordarme</label>
            </div>
            <a class="auth-link text-decoration-none" href="#">¿Olvidaste la contraseña?</a>
          </div>

          <button type="submit" class="btn btn-brand w-100 py-2">ENTRAR</button>
        </form>

        <hr class="my-4">
        <p class="text-center mb-0">
          ¿No tienes cuenta?
          <a class="auth-link text-decoration-none" href="registro.html">Regístrate</a>
        </p>
      </div>

      <p class="text-center mt-4 mb-0">
        <a class="text-decoration-none text-secondary" href="index.html">&larr; Volver a la tienda</a>
      </p>

    </div>
  </div>
</main>

<!-- JS de Bootstrap (necesario para componentes interactivos) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>

<!-- Validación del formulario con Bootstrap -->
<script>
  (function () {
    "use strict";
    var forms = document.querySelectorAll(".needs-validation");
    Array.prototype.forEach.call(forms, function (form) {
      form.addEventListener("submit", function (e) {
        if (!form.checkValidity()) {
          e.preventDefault();
          e.stopPropagation();
        }
        form.classList.add("was-validated");
      }, false);
    });
  })();
</script>
</body>
</html>
